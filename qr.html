<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Zovious QR Minigame</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    background: #000;
    color: #d4f6ff;
    font-family: "IBM Plex Mono", monospace;
    padding: 20px;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { text-align: center; color: #66b3ff; font-size: 24px; margin-bottom: 10px; }
  p { text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 30px; }
  .qr-box {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(102, 179, 255, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
</head>
<body>
<h1>Zovious Wireframe Shooter (Mini)</h1>
<p>以下のQRコードを読み込むと、QRコード自体に埋め込まれた超軽量版ボス戦ゲームが起動します。<br>※フルバージョンのゲームは容量オーバーのためQR単体に収めることは物理的に不可能です。このQRは約2.9KBの2D軽量版を含んでいます。</p>

<div class="qr-box" id="qr-container">
  <canvas id="qr-canvas"></canvas>
</div>

<script>
  // A super-minimal 2D version of the boss battle to fit in a data URI.
  const minigameHtml = "<!DOCTYPE html><html style='background:#000;color:#0ff;font-family:monospace;overflow:hidden;touch-action:none'><head><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0'></head><body><canvas id='c' style='width:100vw;height:100vh;display:block'></canvas><script>let w=innerWidth,h=innerHeight,ctx=c.getContext('2d'),p={x:w/2,y:h*.8,hp:3,c:0},b=[],e=[],f=0,sc=0;c.width=w;c.height=h;let bs={x:w/2,y:h*.2,hp:100,t:0,mx:2};let kL=0,kR=0,kS=0;onkeydown=k=>{if(k.key=='ArrowLeft')kL=1;if(k.key=='ArrowRight')kR=1;if(k.key==' ')kS=1;};onkeyup=k=>{if(k.key=='ArrowLeft')kL=0;if(k.key=='ArrowRight')kR=0;if(k.key==' ')kS=0;};c.ontouchstart=e=>{let tx=e.touches[0].clientX;if(tx<w/2){kL=1;kR=0;}else{kR=1;kL=0;}kS=1;};c.ontouchend=e=>{kL=kR=kS=0;};setInterval(()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);if(p.hp<=0)return ctx.fillText('GAME OVER',w/2-30,h/2);if(bs.hp<=0)return ctx.fillText('CLEAR! SC:'+sc,w/2-40,h/2);ctx.strokeStyle='#0ff';f++;p.c--;if(kL)p.x-=10;if(kR)p.x+=10;if(kS&&p.c<=0){b.push({x:p.x,y:p.y-10,v:-15});p.c=10;}ctx.beginPath();ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x-15,p.y+10);ctx.lineTo(p.x+15,p.y+10);ctx.closePath();ctx.stroke();ctx.font='16px monospace';ctx.fillStyle='#0ff';ctx.fillText('HP:'+p.hp+' SC:'+sc+' BOSS:'+bs.hp,10,30);bs.x+=Math.sin(f*.02)*2;ctx.strokeStyle='#f80';ctx.strokeRect(bs.x-40,bs.y-20,80,40);ctx.strokeRect(bs.x-10,bs.y-10,20,20);if(f%40==0)e.push({x:bs.x,y:bs.y+20,v:6});if(f%70==0){e.push({x:bs.x-30,y:bs.y+20,v:5});e.push({x:bs.x+30,y:bs.y+20,v:5});}for(let i=b.length-1;i>=0;i--){b[i].y+=b[i].v;ctx.fillStyle='#fff';ctx.fillRect(b[i].x-2,b[i].y-5,4,10);if(b[i].y<bs.y+20&&Math.abs(b[i].x-bs.x)<40){bs.hp--;sc+=10;b.splice(i,1);}else if(b[i].y<0)b.splice(i,1);}for(let i=e.length-1;i>=0;i--){e[i].y+=e[i].v;ctx.fillStyle='#f00';ctx.fillRect(e[i].x-3,e[i].y-3,6,6);if(Math.abs(e[i].x-p.x)<15&&Math.abs(e[i].y-p.y)<15){p.hp--;e.splice(i,1);}else if(e[i].y>h)e.splice(i,1);}},30);<" + "/script></body></html>";

  // We optimize the data URI length by encoding it. QR codes max capacity is 2953 bytes.
  // We use errorCorrectionLevel L for maximum capacity.
  // We also try to use base64 encoding instead of URI encoding because base64 is slightly shorter
  const encodedHtml = btoa(minigameHtml);
  const dataUri = "data:text/html;base64," + encodedHtml;

  const canvas = document.getElementById('qr-canvas');
  QRCode.toCanvas(canvas, dataUri, {
    errorCorrectionLevel: 'L',
    margin: 4,
    width: 350,
    color: {
      dark: '#000000',
      light: '#ffffff'
    }
  }, function (error) {
    if (error) {
      console.error(error);
      const errBox = document.createElement('div');
      errBox.style.color = 'red';
      errBox.textContent = "QRコードの生成に失敗しました: " + error.message;
      document.getElementById('qr-container').appendChild(errBox);
    }
  });
</script>
</body>
</html>
